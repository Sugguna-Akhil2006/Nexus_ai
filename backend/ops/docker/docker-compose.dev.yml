version: '3.8'

services:
  backend:
    build:
      context: ../../../
      dockerfile: backend/ops/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../../../backend:/app/backend
    environment:
      - ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
